[project]
name = "konkyo"
version = "0.1.0"
description = "带出典回答的公文 Agent"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60",        # OpenAI 兼容 SDK。DeepSeek 等也走这个接口
    "python-dotenv>=1.0",  # 从 .env 读环境变量
    "fastapi>=0.115",      # S2 起：给前端提供 HTTP/SSE 端点
    "uvicorn>=0.30",       # ASGI server，跑 FastAPI 用
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",  # LLM.chat_stream()/server.py 的端点都是 async def，测它们要跑在 event loop 里
    "httpx>=0.27",           # FastAPI 官方推荐的测试客户端，直接调 ASGI app 不用真的起 uvicorn
]

[tool.pytest.ini_options]
asyncio_mode = "auto"  # 测 async 函数不用给每个测试函数单独加 @pytest.mark.asyncio

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/konkyo"]
